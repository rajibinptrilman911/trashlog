  />
  <!-- Arrow Head -->
  <polygon
    points="74,22 88,38 67,40"
    fill="#66BA33"
  />
  <!-- Central Leaf -->
  <path
    d="M 36 67 C 35 48, 48 32, 64 24 C 65 42, 55 60, 36 67 Z"
