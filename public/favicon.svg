<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tlCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70BE38" />
      <stop offset="50%" stop-color="#4EA72E" />
      <stop offset="100%" stop-color="#1E5E24" />
    </linearGradient>
    <linearGradient id="tlLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388E28" />
      <stop offset="60%" stop-color="#6CBD34" />
      <stop offset="100%" stop-color="#88D13B" />
    </linearGradient>
  </defs>
  <!-- Circular Arrow Track -->
  <path
    d="M 73 70 A 33 33 0 1 1 80 34"
    fill="none"
    stroke="url(#tlCircle)"
    stroke-width="9.5"
